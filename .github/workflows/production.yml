name: Deploy Production
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    branches:
      - release
jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 20.15.0
      - name: Run Tests
        uses: cypress-io/github-action@v6
        with:
          component: true
          build: yarn build
          start: yarn start
          command: yarn test:ci
          browser: chrome
          wait-on: "http://localhost:3000"
      - name: Install Vercel CLI
        run: npm install --global vercel@canary
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.CI_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.CI_TOKEN }}
      - name: Deploy Project Build Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.CI_TOKEN }}
