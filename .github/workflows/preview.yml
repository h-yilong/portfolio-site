name: Deploy Preview
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    branches-ignore:
      - release
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@canary
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.CI_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.CI_TOKEN }}
      - name: Deploy Project Build Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.CI_TOKEN }}
