<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" class="circular" viewBox="25 25 50 50">
  <defs>
    <style>
      .circular {
        -webkit-animation: rotate 1.3s linear infinite;
        animation: rotate 1.3s linear infinite;
        height: 100%;
        transform-origin: center;
        width: 100%;
      }
      .path {
        stroke-dasharray: 1, 200;
        stroke-dashoffset: 0;
        -webkit-animation:
          dash 1.3s ease-in-out infinite,
          color 3.6s ease-in-out infinite;
        animation:
          dash 1.3s ease-in-out infinite,
          color 3.6s ease-in-out infinite;
        stroke-linecap: round;
      }
      @-webkit-keyframes rotate {
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes rotate {
        100% {
          transform: rotate(360deg);
        }
      }
      @-webkit-keyframes dash {
        0% {
          stroke-dasharray: 1, 200;
          stroke-dashoffset: 0;
        }
        50% {
          stroke-dasharray: 89, 200;
          stroke-dashoffset: -35px;
        }
        100% {
          stroke-dasharray: 89, 200;
          stroke-dashoffset: -124px;
        }
      }
      @keyframes dash {
        0% {
          stroke-dasharray: 1, 200;
          stroke-dashoffset: 0;
        }
        50% {
          stroke-dasharray: 89, 200;
          stroke-dashoffset: -35px;
        }
        100% {
          stroke-dasharray: 89, 200;
          stroke-dashoffset: -124px;
        }
      }
      @-webkit-keyframes color {
        0%,
        100% {
          stroke: oklch(0.828 0.111 230.318);
        }
        50% {
          stroke: oklch(0.827 0.119 306.383);
        }
      }
      @keyframes color {
        0%,
        100% {
          stroke: oklch(0.828 0.111 230.318);
        }
        50% {
          stroke: oklch(0.827 0.119 306.383);
        }
      }
    </style>
  </defs>
  <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="6" stroke-miterlimit="10" />
</svg>
